name = "muabankey"
main = "src/index.js"
compatibility_date = "2025-11-10"

workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/i/*", "/download/*"]

[[d1_databases]]
binding = "DB"
database_name = "muabankey-db"
database_id = "81f478c9-5627-458a-a35f-d483e69d400b"

[[kv_namespaces]]
binding = "CACHE"
id = "c8dd77b0855b4012b0c68bcb62027f7a"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "muabankey-assets"

[ai]
binding = "AI"

[observability]
enabled = true

# Cron: dọn topup hết hạn, đơn treo, token hết hạn (mỗi 10 phút)
[triggers]
crons = ["*/10 * * * *"]

[vars]
ENV = "production"
SITE_NAME = "MuaBanKey"
SITE_TAGLINE = "Bản quyền số - Giao key tự động 24/7"
SUPPORT_TELEGRAM = "https://t.me/muabankey"
SUPPORT_ZALO = "https://zalo.me/0000000000"
SESSION_TTL_DAYS = "30"
