      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="lgb"><feGaussianBlur stdDeviation="44"/></filter>
  </defs>

  <rect width="800" height="500" fill="url(#lg1)"/>
  <rect width="800" height="500" fill="url(#lg2)"/>

  <g opacity="0.18" filter="url(#lgb)">
