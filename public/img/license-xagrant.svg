<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="XArena Grant - Tool tăng tài nguyên">
  <defs>
    <linearGradient id="xg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#052e16"/>
      <stop offset="45%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <radialGradient id="xg2" cx="0.75" cy="0.2" r="0.8">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="xg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.58"/>
    </linearGradient>
    <linearGradient id="xg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="xgb"><feGaussianBlur stdDeviation="44"/></filter>
  </defs>

  <rect width="800" height="500" fill="url(#xg1)"/>
  <rect width="800" height="500" fill="url(#xg2)"/>

  <g opacity="0.2" filter="url(#xgb)">
    <circle cx="120" cy="430" r="130" fill="#4ade80"/>
    <circle cx="690" cy="80" r="110" fill="#facc15"/>
  </g>

  <g stroke="#ffffff" stroke-opacity="0.07" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/><line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="500"/><line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/><line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/><line x1="700" y1="0" x2="700" y2="500"/>
  </g>

  <!-- Bieu tuong: 4 loai tai nguyen dang tang -->
  <g transform="translate(400,192)">
    <circle r="92" fill="#ffffff" fill-opacity="0.12"/>
    <circle r="92" fill="none" stroke="#ffffff" stroke-opacity="0.32" stroke-width="2"/>

    <!-- Mui ten tang, o giua -->
    <g transform="translate(0,-30)">
      <path d="M0 -30 L22 -2 H10 V22 H-10 V-2 H-22 Z"
            fill="url(#xg4)" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"
            stroke-linejoin="round"/>
    </g>

    <!-- 4 o tai nguyen: thit, go, da, vang -->
    <g transform="translate(-54,44)">
      <rect x="-20" y="-16" width="40" height="32" rx="8" fill="#ffffff" fill-opacity="0.16"
            stroke="#ffffff" stroke-opacity="0.45" stroke-width="2"/>
      <text x="0" y="6" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="800"
            font-family="'Segoe UI',system-ui,sans-serif">T</text>
    </g>
    <g transform="translate(-18,44)">
      <rect x="-20" y="-16" width="40" height="32" rx="8" fill="#ffffff" fill-opacity="0.16"
            stroke="#ffffff" stroke-opacity="0.45" stroke-width="2"/>
      <text x="0" y="6" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="800"
            font-family="'Segoe UI',system-ui,sans-serif">G</text>
    </g>
    <g transform="translate(18,44)">
      <rect x="-20" y="-16" width="40" height="32" rx="8" fill="#ffffff" fill-opacity="0.16"
            stroke="#ffffff" stroke-opacity="0.45" stroke-width="2"/>
      <text x="0" y="6" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="800"
            font-family="'Segoe UI',system-ui,sans-serif">Đ</text>
    </g>
    <g transform="translate(54,44)">
      <rect x="-20" y="-16" width="40" height="32" rx="8" fill="#facc15" fill-opacity="0.9"
            stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
      <text x="0" y="6" text-anchor="middle" fill="#052e16" font-size="17" font-weight="800"
            font-family="'Segoe UI',system-ui,sans-serif">V</text>
    </g>
  </g>

  <text x="400" y="352" text-anchor="middle" fill="#ffffff" fill-opacity="0.97"
        font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="36" font-weight="800"
        letter-spacing="0.5">XArena Grant</text>
  <text x="400" y="392" text-anchor="middle" fill="#ffffff" fill-opacity="0.75"
        font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="17" font-weight="600"
        letter-spacing="5">TĂNG TÀI NGUYÊN</text>

  <g opacity="0.65">
    <text x="400" y="452" text-anchor="middle" fill="#ffffff"
          font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="600"
          letter-spacing="2.5">CHẠY BẰNG CMD · KHÔNG CẦN ĐĂNG NHẬP</text>
  </g>
  <rect y="330" width="800" height="170" fill="url(#xg3)"/>
</svg>
