<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Nền tròn tối -->
  <circle cx="512" cy="512" r="500" fill="#1a1a2e"/>

  <!-- Ánh sáng vàng xung quanh -->
  <radialGradient id="glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
    <stop offset="0%" stop-color="#ffd700" stop-opacity="0.35"/>
    <stop offset="70%" stop-color="#ffd700" stop-opacity="0.05"/>
    <stop offset="100%" stop-color="#ffd700" stop-opacity="0"/>
  </radialGradient>
  <circle cx="512" cy="512" r="512" fill="url(#glow)"/>

  <!-- Khôi xanh da trời -->
  <path d="M 512 180 C 320 180 180 320 180 512 C 180 704 320 844 512 844 C 704 844 844 704 844 512 C 844 320 704 180 512 180 Z"
        fill="#0d6efd" stroke="#ffd700" stroke-width="14"/>

  <!-- Đường xoáy vàng trên khôi (spiral) -->
  <path d="M 512 380 C 580 380 640 440 640 512 C 640 584 580 644 512 644 C 444 644 384 584 384 512 C 384 440 444 380 512 380 Z"
        fill="none" stroke="#ffd700" stroke-width="22" stroke-linecap="round"/>

  <!-- Chấm vàng giữa xoáy -->
  <circle cx="512" cy="512" r="28" fill="#ffd700"/>

  <!-- Cạnh khôi -->
  <path d="M 512 180 C 560 160 620 180 650 220 C 680 260 700 340 690 420 C 680 500 660 580 640 660"
        fill="none" stroke="#ffd700" stroke-width="18" stroke-linecap="round"/>
  <path d="M 512 844 C 460 860 400 840 370 800 C 340 760 320 680 330 600 C 340 520 360 440 380 360"
        fill="none" stroke="#ffd700" stroke-width="18" stroke-linecap="round"/>

  <!-- Lanza cắm lên phía sau -->
  <path d="M 180 40 L 220 980 L 240 980 L 200 40 Z" fill="#2c3e50"/>
  <path d="M 220 40 L 260 140 L 220 240 L 180 140 Z" fill="#c0c0c0"/>
</svg>
